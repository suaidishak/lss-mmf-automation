name: LSS MMF 30-Minute Update

on:

  schedule:

    - cron: "0,30 * * * *"
      timezone: "Asia/Kuala_Lumpur"

  workflow_dispatch:

jobs:

  mmf-update:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build MMF source structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path("mmf_source")

          multi_station_sites = {
              1,
              5,
              12,
              18,
              27,
              33,
              41
          }

          total = 0

          for site_no in range(1, 45):

              site = f"LSS-{site_no:04d}"

              site_dir = root / site

              site_dir.mkdir(
                  parents=True,
                  exist_ok=True
              )

              station_count = (
                  2
                  if site_no in multi_station_sites
                  else 1
              )

              for station_no in range(
                  1,
                  station_count + 1
              ):

                  station = (
                      f"WS-{station_no:02d}"
                  )

                  file = (
                      site_dir
                      / f"{station}.json"
                  )

                  with open(
                      file,
                      "w",
                      encoding="utf-8"
                  ) as f:

                      json.dump(
                          {
                              "site": site,
                              "station": station,
                              "parameters": {}
                          },
                          f,
                          indent=2
                      )

                  total += 1

          print(
              f"MMF weather stations created: {total}"
          )
          PY

      - name: Generate MMF snapshot
        run: |
          python generate_mmf.py

      - name: Upload MMF snapshot
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python upload_mmf.py
